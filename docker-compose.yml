version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auditiq-postgres
    environment:
      POSTGRES_DB: auditiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./auditIq-backend
    container_name: auditiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auditiq_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8082:8082"

  frontend:
    build: ./auditIq-frontend
    container_name: auditiq-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
